name: Refresh lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chore/wxt-security-refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Refresh WXT and patched transitive resolutions
        run: |
          yarn up -R \
            wxt \
            @wxt-dev/module-react \
            brace-expansion \
            defu \
            http-cache-semantics \
            ip-address

      - name: Commit refreshed dependency lockfile
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          git add package.json yarn.lock

          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh patched transitive dependencies"
          git push origin "HEAD:$HEAD_BRANCH"
