name: Temporary PR 25 patch

on:
  push:
    branches:
      - agent/fix-autofill-and-sidepanel

permissions:
  contents: write

jobs:
  patch-sidepanel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-autofill-and-sidepanel

      - name: Apply strict TypeScript fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("entrypoints/sidepanel/App.tsx")
          text = path.read_text()

          replacements = {
              "Number.parseInt(num[i], 10)": "Number.parseInt(num.charAt(i), 10)",
              '''  const prefix =
              spec.prefixes[Math.floor(Math.random() * spec.prefixes.length)];
            return generateLuhn(prefix, spec.length);''': '''  const prefix =
              spec.prefixes.at(Math.floor(Math.random() * spec.prefixes.length)) ?? "4";
            return generateLuhn(prefix, spec.length);''',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected pattern not found: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrypoints/sidepanel/App.tsx
          git commit -m "fix: satisfy strict sidepanel type checks"
          git push origin HEAD:agent/fix-autofill-and-sidepanel
